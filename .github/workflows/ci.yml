name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-h2:
    name: backend tests (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  backend-postgres:
    name: backend tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kadkerja
          POSTGRES_USER: kadkerja
          POSTGRES_PASSWORD: kadkerja
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kadkerja" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests against PostgreSQL (Flyway migration + API)
        run: ./mvnw -B verify -Dspring.profiles.active=postgres

  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: docker compose (PostgreSQL + API + web) + Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KADKERJA_PROFILES: postgres,demo
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright (Chromium)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright end-to-end tests (real Chromium -> nginx -> API -> PostgreSQL)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8081
        run: npm run e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      # After the e2e tests: the smoke test blocks the demo user "tech" from this machine on purpose.
      - name: Smoke test through nginx
        run: scripts/compose-smoke.sh http://localhost:8081
      - name: Restart keeps the data (PostgreSQL volume, demo data not added twice)
        run: |
          q() { docker compose exec -T db psql -U kadkerja -d kadkerja -tAc "$1"; }
          before=$(q "select count(*) from job_card")
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 180
          sleep 5
          after=$(q "select count(*) from job_card")
          echo "job cards before restart: $before, after: $after"
          test "$before" -gt 0
          test "$before" = "$after"
          test "$(q "select count(*) from flyway_schema_history where success")" -ge 7
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
