server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Photos: the API takes 4 MB per file / 5 MB per request and answers 413 itself.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        # Overwrite (do not append to) anything the client sent, so the API's sign-in limit and
        # customer-link rate limit see the real client address and cannot be dodged with a fake header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
    }

    # Vite puts a content hash in every file name under /assets.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # React Router: every other path (/, /jobs/12, /t/<link>) is the app's index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
