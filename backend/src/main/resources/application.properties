spring.application.name=kadkerja
# Local default: in-memory H2 in PostgreSQL mode (no setup). Use the "postgres" profile for a real database.
spring.datasource.url=jdbc:h2:mem:kadkerja-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Illustrative SST rate for taxable quote lines (percent). Not tax advice.
kadkerja.sst-rate-percent=8
